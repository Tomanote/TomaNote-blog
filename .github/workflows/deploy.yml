name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build
        env:
          SITE_URL: https://blog.tomanote.app

      - name: Copy static assets (CNAME, .nojekyll, manifest)
        run: |
          cp public/CNAME dist/CNAME
          cp public/.nojekyll dist/.nojekyll
          cp public/manifest.webmanifest dist/manifest.webmanifest
          cp public/robots.txt dist/robots.txt
          cp public/rss-styles.xsl dist/rss-styles.xsl
          cp public/favicon.ico dist/favicon.ico
          cp public/icon-*.png dist/
          cp public/icon-svg.svg dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4